version: 2

models:
  - name: fct_daily_retail_sales
    description: "Master unified time-series analytics data mart unpivoting transactional daily rows and joining item pricing, calendars, and structural dimension profiles."
    columns:
      - name: store_id
        description: "Unique warehouse identification key for the localized Walmart retail store branch."
        tests:
          - not_null

      - name: item_id
        description: "Unique structural product identification key mapping tracking target merchandise."
        tests:
          - not_null

      - name: daily_sales_units
        description: "The historical scalar record count tracking total product items sold on this calendar date."
        tests:
          - not_null

      - name: daily_gross_revenue_usd
        description: "Calculated yield index computing total daily sales units multiplied by item selling price vectors."
        tests:
          - not_null
  - name: fct_predictive_features
    description: "Advanced machine learning feature matrix computing time-series partition lags and mathematical moving rolling averages across product hierarchies."
    columns:
      - name: sales_lag_1d
        description: "Historical product sales volume volume metric from exactly 1 day ago."
        tests:
          - not_null

      - name: sales_lag_7d
        description: "Historical product sales volume volume metric from exactly 1 week ago."
        tests:
          - not_null

      - name: sales_rolling_avg_7d
        description: "Moving rolling mean sales demand velocity calculated over a trailing 7-day partition window."
        tests:
          - not_null

  - name: fct_ml_training_matrix
    description: "Finalized machine learning model feature matrix complete with time-series lags, moving rolling averages, and logarithmic target variance transformations."
    columns:
      - name: log_daily_sales_units
        description: "The log-transformed historical demand metric variable target tracking ln(x + 1)."
        tests:
          - not_null
